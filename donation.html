<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate | Pet Care & Adoption Network</title>
</head>
<body>

  
    <header>
        <div>
            <img src="Diagonal Black Paw Print Trail.png"  width="50">
            <h1>Pet Care & Adoption Network</h1>
        </div>
        <nav>
            <a href="index.html">Login</a> | 
            <a href="register.html">Register</a> | 
            <a href="public.html">Back to Public Page</a>
        </nav>
    </header>

    <hr>

    
    <main>
        <section>
            <h2>Donate to Happy Paws Shelter</h2>
            <p>Your donation helps us rescue, heal, and find loving homes for animals in need.</p>

            
            <form action="#" method="POST">
                
                
                <fieldset>
                    <legend>Donor Information</legend>
                    
                    <label for="donorName">Your Name:</label><br>
                    <input type="text" id="donorName" name="donorName" placeholder="e.g. Rahim Uddin" maxlength="50">
                    <br><br>

                    <label for="donorEmail">Email Address (For Receipt):</label><br>
                    <input type="email" id="donorEmail" name="donorEmail" placeholder="example@mail.com" required>
                    <br><br>

                    
                    <input type="checkbox" id="isAnonymous" name="isAnonymous" value="yes">
                    <label for="isAnonymous">I want to donate anonymously (Hide my name from the public)</label>
                    <br><br>
                </fieldset>

                <br>

                
                <fieldset>
                    <legend>Donation Amount</legend>
                    
                    <label for="donationAmount">Amount (BDT):</label><br>
                   
                    <input type="number" id="donationAmount" name="amount" min="10" step="50" placeholder="e.g. 500" required>
                    <br><br>
                </fieldset>

                <br>

               
                <button type="submit">Proceed to Secure Payment (SSLCommerz)</button>

            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Pet Care & Adoption Network. All rights reserved.</p>
    </footer>

</body>
</html>
