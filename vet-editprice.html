<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Service | Pet Care & Adoption Network</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vet.css">
</head>
<body>

   
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        
        
        <div style="background-color: white; width: 400px; margin: 150px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
            
           
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0;">Edit Service Price</h2>
                <!-- The 'X' button takes them back to the Services page -->
                <a href="vet-services.html" style="text-decoration: none; font-size: 20px; color: #333;">&times;</a>
            </div>

            
            <form action="vet-services.html" method="POST" onsubmit="return validatePrice()" novalidate>
                
                <label for="editServiceName">Select Service:</label><br>
                <select id="editServiceName" name="serviceName" required style="width: 95%; padding: 8px; margin-top: 5px;">
                    <option value="checkup">General Checkup</option>
                    <option value="vaccination">Vaccination</option>
                    <option value="deworming">Deworming</option>
                    <option value="surgery">Surgery (Minor)</option>
                </select>
                <br><br>

                <label for="editServicePrice">New Price (BDT):</label><br>
                <input type="number" id="editServicePrice" name="servicePrice" value="500" min="0" required style="width: 95%; padding: 8px; margin-top: 5px;">
                <br><br>

                
                <div style="text-align: right; border-top: 1px solid #ddd; padding-top: 15px; margin-top: 15px;">
                    <a href="vet-services.html"><button type="button" style="padding: 8px 15px; margin-right: 10px;">Cancel</button></a>
                   
                    <button type="submit" style="padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px;">Save Price</button>
                </div>
                
            </form>
        </div>
    </div>
    <script src="vet-editprice.js"></script>
</body>
</html>
