<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Edit Pet | Pet Owner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="owner.css">
</head>
<body>

   
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        
        
        <div style="background-color: white; width: 400px; margin: 120px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0;">Edit Bruno's Details</h2>
                <a href="owner-pets.html" style="text-decoration: none; font-size: 20px; color: #333;">&times;</a>
            </div>

            <form action="#" method="POST" onsubmit="return validateEditPet()" enctype="multipart/form-data">
                
                <label for="editAge">Age (Years):</label><br>
                <input type="number" id="editAge" name="editAge" value="3" min="0" style="width: 95%; padding: 8px; margin-top: 5px;" required>
                <br><br>

                <label for="editWeight">Weight (kg):</label><br>
                <input type="number" id="editWeight" name="editWeight" value="28" step="0.1" style="width: 95%; padding: 8px; margin-top: 5px;" required>
                <br><br>

                <label for="editPhoto">Upload New Photo (Optional):</label><br>
                <input type="file" id="editPhoto" name="editPhoto" accept="image/*" style="margin-top: 5px;">
                <br><br>

                <div style="text-align: right; border-top: 1px solid #ddd; padding-top: 15px;">
                    <a href="owner-pets.html"><button type="button" style="padding: 8px 15px; margin-right: 10px;">Cancel</button></a>
                    <button type="submit" style="padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px;">Update Pet</button>
                </div>
                
            </form>
        </div>
    </div>
    <script src="owner-pets.js"></script>

</body>
</html>
