<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Appointment | Pet Owner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="owner.css">
</head>
<body>

   
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6);">
        
       
        <div style="background-color: white; width: 450px; margin: 100px auto; padding: 20px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0;">Confirm Booking</h2>
                
                <a href="owner-book.html" style="text-decoration: none; font-size: 24px; color: #333;">&times;</a>
            </div>

            
            <div style="background-color: #f1f8ff; padding: 15px; margin-bottom: 20px; border-left: 4px solid #007bff;">
                <p style="margin: 5px 0;"><strong>Vet:</strong> Dr. Karim</p>
                <p style="margin: 5px 0;"><strong>Date:</strong> 14 Oct 2026</p>
                <p style="margin: 5px 0;"><strong>Time Slot:</strong> 10:00 AM - 10:30 AM</p>
            </div>

            
            <form action="owner-dashboard.html" method="POST" onsubmit="return validateBooking()" novalidate>
                
                <label for="selectPet">Select Pet for this visit:</label><br>
                <select id="selectPet" name="pet" style="width: 95%; padding: 8px; margin-top: 5px;" required>
                    <option value="" disabled selected>-- Choose a Pet --</option>
                    <option value="bruno">Bruno (Dog)</option>
                    <option value="mitu">Mitu (Cat)</option>
                </select>
                <br><br>

                <label for="reason">Reason for Visit:</label><br>
                <textarea id="reason" name="reason" rows="2" style="width: 95%; padding: 8px; margin-top: 5px;" placeholder="e.g. Vaccination"></textarea>
                <br><br>

               
                <div style="text-align: right; border-top: 1px solid #ddd; padding-top: 15px; margin-top: 15px;">
                    <a href="owner-book.html"><button type="button" style="padding: 8px 15px; margin-right: 10px;">Cancel</button></a>
                    
                    <button type="submit" style="padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px;">Confirm Appointment</button>
                </div>

            </form>
        </div>
    </div>
    <script src="owner-book-confirm.js"></script>

</body>
</html>
