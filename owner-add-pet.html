<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Add Pet | Pet Owner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="owner.css">
</head>
<body>

    
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        
        
        <div style="background-color: white; width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
            
           
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0;">Add New Pet</h2>
                
                <a href="owner-pets.html" style="text-decoration: none; font-size: 20px; color: #333;">&times;</a>
            </div>

           
            <form action="#" method="POST" onsubmit="return validateAddPet()" enctype="multipart/form-data">
                
                <label for="petName">Pet Name:</label><br>
                <input type="text" id="petName" name="petName" placeholder="e.g. Rocky" style="width: 95%; padding: 8px; margin-top: 5px;" required>
                <br><br>

                <label for="petBreed">Breed:</label><br>
                <input type="text" id="petBreed" name="petBreed" placeholder="e.g. German Shepherd" style="width: 95%; padding: 8px; margin-top: 5px;" required>
                <br><br>

                <label for="petAge">Age (Years):</label><br>
                <input type="number" id="petAge" name="petAge" min="0" style="width: 95%; padding: 8px; margin-top: 5px;" required>
                <br><br>

                <label for="petWeight">Weight (kg):</label><br>
                <input type="number" id="petWeight" name="petWeight" step="0.1" style="width: 95%; padding: 8px; margin-top: 5px;" required>
                <br><br>

                <label for="petPhoto">Upload Pet Photo:</label><br>
                <input type="file" id="petPhoto" name="petPhoto" accept="image/*" style="margin-top: 5px;" required>
                <br><br>

                
                <div style="text-align: right; border-top: 1px solid #ddd; padding-top: 15px;">
                    <a href="owner-pets.html"><button type="button" style="padding: 8px 15px; margin-right: 10px;">Cancel</button></a>
                    <button type="submit" style="padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px;">Save Pet</button>
                </div>
                
            </form>
        </div>
    </div>
    <script src="owner-pets.js"></script>

</body>
</html>
